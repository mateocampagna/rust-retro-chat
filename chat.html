<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Room - RetroChat</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="chat-screen">
        <div class="chat-header">
            <h2 id="welcome-msg">CHAT v1.0</h2>
        </div>

        <ul id="chat-messages"></ul>
        
        <div id="chat-controls">
            <textarea id="msj" placeholder="Write a message..." autocomplete="off" rows="1"></textarea>
            <button id="btn-enviar">Send</button>
        </div>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension/lib/index.umd.js"></script>

    <script src="/client.js"></script>
</body>
</html>
