[package]
name = "web-chat"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.8", features = ["ws", "macros"]}
futures = "0.3.32"
serde_json = "1.0.149"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.8.0", features = ["runtime-tokio", "sqlite"] }
bcrypt = "0.19.0"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
chrono = "0.4" # Para manejar la fecha de expiración del token